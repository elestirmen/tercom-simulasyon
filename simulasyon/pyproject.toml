[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-denied-mission-control"
version = "0.2.0"
description = "GPS-denied visual localization simulation and mission-control dashboard"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "Pillow>=10.0",
    "pyproj>=3.6",
    "PySide6>=6.8",
    "rasterio>=1.4",
    "tensorflow>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
gps-denied-mission-control = "simulasyon_yonlendirme_uclu_dashboard:main_qt"

[tool.setuptools]
py-modules = [
    "gps_denied_autonomy",
    "mission_control_ui",
    "simulasyon_yonlendirme_uclu_dashboard",
]

[tool.setuptools.packages.find]
include = ["simulation_core*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "simulasyon_hizli.py",
    "simulasyon_konuma_otonom_gitme.py",
    "simulasyon_konuma_otonom_gitme_HIZLI.py",
    "simulasyon_otonom.py",
    "simulasyon_yonlendirme.py",
    "simulasyon_yonlendirme_model_okuma.py",
    "simulasyon_yonlendirme_uclu.py",
    "template_matching_dongu.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"simulasyon_yonlendirme_uclu_dashboard.py" = ["E402", "E731", "I001"]
"tests/test_ui.py" = ["E402"]
